# !-----------------------------------------------------------------------------------------------!
#                       Welcome to the main configuration of ${project.name}
# !-----------------------------------------------------------------------------------------------!
#
#    - COLOR CODES are supported with the '&' character, e.g. "Hello &cworld."
#      Hex colours use &#RRGGBB, e.g. "Hello &#55FF55world."
#    - Save this file in UTF-8 if you use symbols or other special characters.
#    - Apply changes with /smp reload (or restart the server).
#    - New options added by plugin updates are appended to this file automatically.
#
# !-----------------------------------------------------------------------------------------------!

# -------------------------------------------------------------------------------------------------
# Death chests: when a player dies, their items stay where they died.
# Right-click (or hit) your own to get everything back automatically; other players loot by hand.
# -------------------------------------------------------------------------------------------------
Death_Storage:
  # Enable or disable death chests
  Enable_Death_Storage: true
  # BODY  - the player's body (with their skin and armour) lies where they died and holds the items.
  #         No block is placed.
  # CHEST, BARREL, ... - a block of that type holds the items instead.
  Storage_Material: BODY
  # Text shown above the body or chest (placeholders: {player})
  Hologram_Text: "&6{player}'s loot"
  # Distance (in blocks) from which the hologram can be seen
  Hologram_Visible_Range: 20
  # How long a body or death chest stays, in hours. After that it disappears, together with any items
  # still in it. 168 = one week, 24 = one day, 0 = never. Decimals work too (0.5 = 30 minutes).
  # A chest block in an area nobody is in disappears the next time that area is loaded.
  Expire_After_Hours: 168

# -------------------------------------------------------------------------------------------------
# Locator bar
# -------------------------------------------------------------------------------------------------
Locator_Toggle:
  # true (default) - use the vanilla locator bar: everyone sees nearby players on their bar, and the
  #                  name of the player you are facing is shown above your hotbar in their waypoint colour.
  #                  /track death still works.
  # false          - use the custom tracking system instead: the bar is hidden until you track someone,
  #                  and players have to accept a /track request first.
  Enable_Locator_Bar: true
  # Where the locator bar works: all, or any of normal (overworld), nether, the end - e.g. "normal, nether"
  Allowed_Environements: "all"

# -------------------------------------------------------------------------------------------------
# Edit your particle trails
# -------------------------------------------------------------------------------------------------
Projectile_Settings:
  Enable_Trails: false
  # Choices - soul_fire_flame, water_bubble, nautilus, flame, smoke, electrik_spark, enchantment, honey, glow, music, flash, heart
  Active_Trail: "soul_fire_flame"
  # How far the player will get knocked back when hit by a snowball, egg or fishing hook (default: 0.4)
  Knockback: 0.4
  Enable_Headshot: true

# -------------------------------------------------------------------------------------------------
# Edit your death effects
# -------------------------------------------------------------------------------------------------
Death_Effects:
  Enable_Death_Effects: false
  # Choices - grid, sky_rocket, big_bang, tornado, disco_ball, bleed, vortex, star, cloud, fountain, dragon
  Active_Death_Effect: "grid"
  # How long the effect plays, in seconds
  Duration_Seconds: 3

# -------------------------------------------------------------------------------------------------
# Custom death messages (edit them in death-messages.yml)
# -------------------------------------------------------------------------------------------------
Death_Messages:
  Enabled: true

# -------------------------------------------------------------------------------------------------
# Nicknames: /nick opens a menu to pick colours, gradients and styles, /nick <name> sets the name.
# Shown in chat, the tab list, join/leave messages, death messages and the locator bar.
# -------------------------------------------------------------------------------------------------
Nicknames:
  Enabled: true
  # Longest nickname allowed (letters, numbers, underscores and spaces)
  Max_Length: 16
  # Also show the nickname in the name tag above the player's head, as "Nickname (AccountName)".
  # Minecraft always shows the account name there, so the nickname is added in front of it.
  # Uses scoreboard teams: turn this off if another plugin (tab/rank plugins) puts players in teams.
  Show_Above_Head: false

# -------------------------------------------------------------------------------------------------
# Edit your server MOTD (the text shown under your server in the multiplayer list)
# -------------------------------------------------------------------------------------------------
MOTD:
  Enable_MOTD: true
  # Up to two lines. Supports & colour codes and &#RRGGBB hex colours.
  # Placeholders: {online}, {max}
  Lines:
    - "&a&lA Minecraft SMP"
    - "&7{online}/{max} players online"

# -------------------------------------------------------------------------------------------------
# Edit your combat settings
# -------------------------------------------------------------------------------------------------
Combat_Settings:
  Enable_Combat_Punishments: true
  # How many seconds should the player wait until he's no longer considered as being in combat
  Combat_Timer: 10

  # Punishment type when a player logs out while in combat
  # Options: INSTANT_DEATH, GHOST_BODY, RANDOM_ITEM_DROP, PVP_LOCKOUT, DEBUFF, NONE
  # - INSTANT_DEATH: Player dies immediately on logout, drops items normally
  # - GHOST_BODY: NPC body remains for other players to kill (recommended)
  # - RANDOM_ITEM_DROP: Random items are dropped at logout location
  # - PVP_LOCKOUT: Player can't deal damage for a period after rejoining
  # - DEBUFF: Player gets negative effects (slowness, weakness, mining fatigue) on rejoin
  # - NONE: No punishment (not recommended for PvP servers)
  Punishment_Type: "GHOST_BODY"

  # Ghost body settings (only used if Punishment_Type is GHOST_BODY)
  Ghost_Body:
    # How long (in seconds) the ghost body stays before despawning
    Duration: 30
    # Should the ghost body have the player's exact health when they logged out?
    Use_Player_Health: true
    # Should the ghost body have the player's armor?
    Use_Player_Armor: true
    # Should the ghost body fight back? (uses player's held item)
    Fight_Back: false

  # PvP lockout settings (only used if Punishment_Type is PVP_LOCKOUT)
  PvP_Lockout:
    # How long (in minutes) the player cannot deal damage after combat-logging
    Duration_Minutes: 15

  # Debuff settings (only used if Punishment_Type is DEBUFF)
  Debuff:
    # How long (in minutes) the debuffs last
    Duration_Minutes: 10
    # Slowness level (1-255, 0 to disable)
    Slowness_Level: 2
    # Weakness level (1-255, 0 to disable)
    Weakness_Level: 2
    # Mining Fatigue level (1-255, 0 to disable)
    Mining_Fatigue_Level: 2

  # Random item drop settings (only used if Punishment_Type is RANDOM_ITEM_DROP)
  Random_Item_Drop:
    # How many random items to drop from the player's inventory
    # Set to -1 to drop all items (same as INSTANT_DEATH)
    # Recommended: 5-15 for balanced punishment
    Amount: 10
    # Should armor be included in the random selection?
    Include_Armor: true
    # Should the hotbar be included in the random selection?
    Include_Hotbar: true

# -------------------------------------------------------------------------------------------------
# Edit your TP request feature (/tp opens a request menu, accept/deny in chat)
# When disabled, /tp behaves exactly like the vanilla command.
# -------------------------------------------------------------------------------------------------
TP:
  Enable_TP: false

# -------------------------------------------------------------------------------------------------
# Edit your duel system settings
# -------------------------------------------------------------------------------------------------
Duel:
  # Enable or disable the duel system
  Enable_Duels: true

  # Request settings
  Request_Timeout_Seconds: 60
  Countdown_Seconds: 5

  # Arena mode: NATURAL (random spot in the overworld), CREATED (admin-created arenas), RANDOM (pick either)
  # Busy arenas are never shared: when every created arena is in use, a natural spot is used instead.
  Arena_Mode: "RANDOM"

  # Team duels (2v2, 3v3, ...). Open the setup menu with /duel team, or /duel and click Team Duel.
  # The lobby leader can pick a format (e.g. 1v3 or 2v4) and add mobs to either team.
  Teams:
    Enabled: true
    # Largest team allowed (4 means up to 4v4)
    Max_Team_Size: 4
    # How long an invitation to a team duel stays valid
    Invite_Timeout_Seconds: 60
    # Allow starting an open lobby with uneven teams, e.g. 2v1.
    # A format the leader picked (like 1v3) can always start once both teams are full.
    Allow_Uneven_Teams: false

    # Mobs that fight for a team. They attack the other team (players and mobs), never their own.
    # The duel still ends when all players of a team are out, whatever mobs are left.
    Mobs:
      Enabled: true
      # Most mobs one team can have
      Max_Per_Team: 8
      # Mobs the leader can choose from (entity names, e.g. ZOMBIE or IRON_GOLEM)
      Allowed:
        - "ZOMBIE"
        - "HUSK"
        - "DROWNED"
        - "SKELETON"
        - "STRAY"
        - "BOGGED"
        - "SPIDER"
        - "CAVE_SPIDER"
        - "CREEPER"
        - "WITCH"
        - "VINDICATOR"
        - "PILLAGER"
        - "PIGLIN_BRUTE"
        - "WITHER_SKELETON"
        - "RAVAGER"
        - "IRON_GOLEM"
        - "SNOW_GOLEM"
        - "WOLF"

  # Kit duels: everyone fights with a kit from duel-kits.yml instead of their own gear. The lobby
  # leader (or, for a 1v1 challenge, the challenger) turns kits on in /duel. Players' own items are
  # kept safe and given back after the duel.
  Kits:
    Enabled: true
    # Time to pick a kit when the duel starts; anyone who hasn't picked by then gets a random one
    Choose_Seconds: 15

  # Arena border: a fixed square vanilla world border that only the duelists see.
  # Players who get outside are pushed back in and take damage.
  Border:
    Enabled: true
    # Distance from the arena centre to each wall, in blocks (the arena is twice this wide).
    # Team duels get 4 extra blocks per extra player on a team.
    Radius: 30
    # Damage per second while outside the border
    Damage_Per_Second: 2.0

  # Natural arena settings (for NATURAL arena mode)
  Natural_Arena:
    # Random spots are picked within this many blocks of the overworld spawn.
    # Spots are usually in unexplored land, so each natural duel generates some new terrain
    # (in the background). Lower this, or use Arena_Mode CREATED, to keep the world smaller.
    Search_Radius: 5000
    # Distance between the two players when they land
    Min_Player_Distance: 30
    # How many random spots to try before giving up (chunks are loaded in the background)
    Max_Search_Attempts: 10
    # Biomes that cannot be used for duels
    Banned_Biomes:
      - "OCEAN"
      - "RIVER"
    # Blocks that players cannot land on
    Banned_Blocks:
      - "LAVA"
      - "CACTUS"
      - "SWEET_BERRY_BUSH"
      - "FIRE"
      - "MAGMA_BLOCK"
      - "POWDER_SNOW"

  # What happens to the loser's items
  # KEEP_INVENTORY - the loser keeps their items
  # DROP_ITEMS - the loser's items drop where they lost, the winner can grab them before returning
  Loot:
    Mode: "KEEP_INVENTORY"

  # Seconds after the duel ends before both players are sent back (or type /duel return)
  End_Return_Countdown_Seconds: 15

  # A fight that lasts longer than this ends in a draw, so nobody can stall forever (0 = no limit)
  Max_Fight_Minutes: 10

  # Cleanup settings (what happens after duel ends)
  # Duels can't grief the world: fire doesn't spread or burn, lava and water can't flow out of
  # the arena, and explosions don't reach outside it. Terrain broken, blown up or flooded during a
  # duel drops nothing and is always put back afterwards, whatever the settings below say.
  Cleanup:
    # Remove blocks placed during the duel (lava, water and fire are always removed)
    Remove_Placed_Blocks: true
    # Give items thrown on the ground during the fight back to whoever threw them
    Remove_Dropped_Items: true
    # Remove leftover projectiles; arrows and tridents that can be picked up go back to the shooter
    Remove_Entities: true

# -------------------------------------------------------------------------------------------------
# Do not change this value.
# -------------------------------------------------------------------------------------------------
Version: 4
