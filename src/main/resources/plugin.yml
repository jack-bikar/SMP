#
# This is the file your server opens to find the main class of your
# plugin and its information. We automatically replace variables here
# from your pom.xml file.
#
name: ${project.name}
version: ${project.version}
main: ${main.class}
author: ${author}
# Minecraft 26.x (Paper)
api-version: '26.1'

commands:
  smp:
    description: SMP plugin help and information
  inv:
    description: Edit player inventories
    aliases: [inventory]
    permission: smp.command.inv
    permission-message: You don't have permission to use this command.
  spawn:
    description: Teleport to spawn
    permission: smp.command.spawn
    permission-message: You don't have permission to use this command.
  track:
    description: Player and death location tracking
    aliases: [tr]
  tp:
    description: Teleport request (opens menu or accept/deny from chat)
  duel:
    description: Duel system commands
    aliases: [d]
    permission: smp.duel
    permission-message: You don't have permission to use this command.
  nick:
    description: Set a coloured nickname (opens a menu)
    aliases: [nickname]
    permission: smp.nick
    permission-message: You don't have permission to use nicknames.
  arena:
    description: Arena management commands
    permission: smp.admin.arena
    permission-message: You don't have permission to manage arenas.
permissions:
  smp.*:
    description: All SMP permissions
    default: op
    children:
      smp.command.*: true
      smp.use.*: true
      smp.admin.*: true
      smp.duel.*: true
      smp.nick: true
      smp.tp.bypass: true
  smp.command.*:
    description: All SMP command permissions
    default: op
    children:
      smp.command.inv: true
      smp.command.spawn: true
      smp.command.spawn.set: true
  smp.command.inv:
    description: Use /inv command
    default: op
  smp.command.spawn:
    description: Use /spawn and /spawn locate
    default: op
  smp.command.spawn.set:
    description: Move the world spawn with /spawn set
    default: op
  smp.use.*:
    description: All SMP use permissions
    default: true
  smp.admin.*:
    description: All SMP admin permissions
    default: op
    children:
      smp.admin.arena: true
      smp.admin.reload: true
      smp.admin.duel: true
      smp.nick.others: true
  smp.admin.arena:
    description: Manage duel arenas
    default: op
  smp.admin.duel:
    description: End any duel with /duel cancel <player>
    default: op
  smp.admin.reload:
    description: Reload the SMP settings with /smp reload
    default: op
  smp.duel:
    description: Use the duel command
    default: true
  smp.duel.queue:
    description: Use the duel queue system
    default: true
  smp.nick:
    description: Use /nick to set your own nickname
    default: true
  smp.nick.others:
    description: Reset other players' nicknames with /nick reset <player>
    default: op
  smp.tp.bypass:
    description: Teleport to players without sending a request
    default: op
  smp.duel.*:
    description: All duel permissions
    default: true
    children:
      smp.duel: true
      smp.duel.queue: true
